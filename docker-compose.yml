name: vibecity

services:
  # ---------- База данных ----------
  db:
    image: mysql:8.0
    container_name: vibecity-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vibecity}
      MYSQL_USER: ${MYSQL_USER:-vibecity}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vibecity}
      TZ: Europe/Minsk
    ports:
      # Только для локального доступа (Prisma Studio / MySQL Workbench).
      # Снаружи хоста порт не публикуется.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

  # ---------- REST API ----------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vibecity-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-vibecity}:${MYSQL_PASSWORD:-vibecity}@db:3306/${MYSQL_DATABASE:-vibecity}
      JWT_SECRET: ${JWT_SECRET:-vibecity-docker-secret-change-me}
      JWT_EXPIRES_IN: 24h
      TZ: Europe/Minsk
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------- React + nginx ----------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vibecity-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  default:
    name: vibecity_network

volumes:
  mysql_data:
    name: vibecity_mysql_data
