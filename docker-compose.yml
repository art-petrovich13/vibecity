services:
  vibecity:
    build: .
    container_name: vibecity
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: vibecity-docker-secret-change-me
      JWT_EXPIRES_IN: 24h
      TZ: Europe/Moscow
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
